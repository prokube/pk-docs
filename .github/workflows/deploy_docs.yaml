name: Deploy Documentation

on:
  push:
    branches:
      - staging
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Include Cloud Build config
        run: cp cloudbuild.yaml docs/.vitepress/dist/cloudbuild.yaml

      # Cloud Build triggers on these branches sync them to prokube.cloud/docs and prokube.ai/docs.
      - name: Deploy to generated-site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ github.ref_name == 'main' && 'gh-pages-main' || 'gh-pages' }}
          publish_dir: docs/.vitepress/dist
