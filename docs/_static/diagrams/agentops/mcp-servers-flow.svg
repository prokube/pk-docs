<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Diagram: agents and other workloads in the workspace reach all MCP servers and memory stores through one workspace MCP endpoint without an API key. External MCP clients reach each server through Agent Gateway at /svc/mcp/workspace/server with an API key that has access to that server.">
  <defs>
    <marker id="mcp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#958dff" />
    </marker>
    <marker id="mcp-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a8b3" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#ffffff" />

  <!-- Column headers -->
  <text x="300" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#535965" letter-spacing="0.06em">INSIDE THE WORKSPACE: NO API KEY</text>
  <text x="880" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#535965" letter-spacing="0.06em">OUTSIDE THE WORKSPACE: API KEY</text>

  <!-- Row 1: callers -->
  <g>
    <rect x="60" y="40" width="230" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="175" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">kagent Agents</text>

    <rect x="310" y="40" width="230" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="425" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Other workloads</text>
    <text x="425" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">in the same workspace</text>

    <rect x="640" y="40" width="480" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="880" y="69" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">External MCP clients</text>
    <text x="880" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">Claude Desktop, Cursor, scripts, CI jobs</text>
  </g>

  <!-- Arrows: callers -> endpoints -->
  <path d="M175,104 C175,130 280,136 295,158" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#mcp-arrow-muted)" />
  <path d="M425,104 C425,130 320,136 305,158" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#mcp-arrow-muted)" />
  <path d="M880,104 L880,158" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#mcp-arrow)" />

  <!-- Row 2: entry points -->
  <rect x="60" y="160" width="480" height="104" rx="20" fill="#faf9fb" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="7 6" />
  <text x="300" y="196" text-anchor="middle" font-size="22" font-weight="900" fill="#111827">Workspace MCP endpoint</text>
  <text x="300" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#535965">One endpoint for the tools of all servers</text>
  <text x="300" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#535965" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gateway-mcp · same workspace only</text>

  <rect x="640" y="160" width="480" height="104" rx="20" fill="#ebebff" stroke="#645ade" stroke-width="2" />
  <text x="880" y="196" text-anchor="middle" font-size="22" font-weight="900" fill="#111827">Agent Gateway</text>
  <text x="880" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#535965">Checks the API key scope, then routes</text>
  <text x="880" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#645ade" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/svc/mcp/&lt;workspace&gt;/&lt;server&gt;</text>

  <!-- Internal bus: one endpoint fans out to every server -->
  <path d="M300,264 L300,296" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" />
  <line x1="150" y1="296" x2="850" y2="296" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" />
  <circle cx="300" cy="296" r="3.5" fill="#a1a8b3" />
  <path d="M150,296 L150,338" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#mcp-arrow-muted)" />
  <path d="M510,296 L510,338" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#mcp-arrow-muted)" />
  <path d="M850,296 L850,338" fill="none" stroke="#a1a8b3" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#mcp-arrow-muted)" />

  <!-- External bus: each server has its own public path -->
  <path d="M970,264 L970,316" fill="none" stroke="#958dff" stroke-width="2.5" />
  <line x1="310" y1="316" x2="1030" y2="316" stroke="#958dff" stroke-width="2.5" />
  <circle cx="970" cy="316" r="3.5" fill="#958dff" />
  <path d="M310,316 L310,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#mcp-arrow)" />
  <path d="M670,316 L670,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#mcp-arrow)" />
  <path d="M1030,316 L1030,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#mcp-arrow)" />

  <!-- Row 3: servers in the workspace -->
  <g>
    <rect x="60" y="340" width="340" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="230" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MCP server</text>
    <text x="230" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">from the Server Catalog</text>
    <text x="230" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#645ade" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ToolHive MCPServer</text>

    <rect x="420" y="340" width="340" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="590" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MCP server</text>
    <text x="590" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">from a custom image</text>
    <text x="590" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#645ade" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ToolHive MCPServer</text>

    <rect x="780" y="340" width="340" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="950" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Memory Store</text>
    <text x="950" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">exposed over MCP</text>
    <text x="950" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#645ade" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">same /svc/mcp path family</text>
  </g>

  <!-- Footer band: how servers join -->
  <rect x="60" y="476" width="1060" height="112" rx="18" fill="#faf9fb" stroke="#c7c2ff" stroke-width="1.5" stroke-dasharray="7 6" />
  <text x="90" y="512" font-size="16" font-weight="800" fill="#111827">Deploy once, reach it both ways</text>
  <text x="90" y="536" font-size="13.5" font-weight="500" fill="#535965">Each deployed server joins the workspace MCP endpoint automatically, so agents in the workspace see its tools.</text>
  <text x="90" y="556" font-size="13.5" font-weight="500" fill="#535965">It also gets its own external URL, which needs an API key with access to that server.</text>
</svg>
