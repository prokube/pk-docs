<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Diagram: external callers reach Agent Gateway, which routes to agents, MCP servers, models, and sandboxes. In-workspace calls bypass the gateway using mesh identity.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#958dff" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a8b3" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#ffffff" />

  <!-- Row 1: external callers -->
  <g>
    <rect x="60" y="40" width="340" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="230" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">External apps &amp; SDKs</text>

    <rect x="420" y="40" width="340" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="590" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">CI/CD &amp; automation</text>

    <rect x="780" y="40" width="340" height="64" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="950" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Upstream agents &amp; apps</text>
  </g>

  <text x="590" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#535965" letter-spacing="0.06em">EXTERNAL, API-KEY-AUTHENTICATED CALLERS</text>

  <!-- Arrows: callers -> gateway -->
  <path d="M230,104 C230,130 470,140 585,158" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M590,104 L590,158" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M950,104 C950,130 710,140 595,158" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Gateway -->
  <rect x="380" y="160" width="420" height="112" rx="20" fill="#ebebff" stroke="#645ade" stroke-width="2" />
  <text x="590" y="205" text-anchor="middle" font-size="24" font-weight="900" fill="#111827">Agent Gateway</text>
  <text x="590" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#535965">Checks API key scope + workspace, then routes</text>
  <text x="590" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#645ade" letter-spacing="0.03em">built on agentgateway</text>

  <!-- Arrows: gateway -> row 3 (short straight tail before the tip keeps the arrowhead clean) -->
  <path d="M590,272 C590,298 170,298 170,318 L170,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M590,272 C590,292 450,294 450,318 L450,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M590,272 C590,292 730,294 730,318 L730,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M590,272 C590,298 1010,298 1010,318 L1010,338" fill="none" stroke="#958dff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Row 3: backends -->
  <g>
    <rect x="40" y="340" width="260" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="170" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">kagent Agents</text>
    <text x="170" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">(A2A)</text>

    <rect x="320" y="340" width="260" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="450" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MCP Servers &amp;</text>
    <text x="450" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Memory Stores</text>

    <rect x="600" y="340" width="260" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="730" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Models</text>
    <text x="730" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#535965">LLM Serving + External Models</text>

    <rect x="880" y="340" width="260" height="100" rx="14" fill="#ffffff" stroke="#e9eaec" stroke-width="1.5" />
    <text x="1010" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Agent Sandboxes</text>
  </g>

  <!-- Internal / mesh traffic: a shared mesh "bus" connects all four backends directly, bypassing the gateway -->
  <line x1="170" y1="458" x2="1010" y2="458" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="170" cy="458" r="3.5" fill="#a1a8b3" />
  <circle cx="450" cy="458" r="3.5" fill="#a1a8b3" />
  <circle cx="730" cy="458" r="3.5" fill="#a1a8b3" />
  <circle cx="1010" cy="458" r="3.5" fill="#a1a8b3" />
  <path d="M170,458 L170,440" fill="none" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <path d="M450,458 L450,440" fill="none" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <path d="M730,458 L730,440" fill="none" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <path d="M1010,458 L1010,440" fill="none" stroke="#a1a8b3" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />

  <rect x="40" y="480" width="1100" height="108" rx="18" fill="#faf9fb" stroke="#c7c2ff" stroke-width="1.5" stroke-dasharray="7 6" />

  <text x="70" y="516" font-size="16" font-weight="800" fill="#111827">Internal (mesh) traffic — no Agent Gateway hop</text>
  <text x="70" y="540" font-size="13.5" font-weight="500" fill="#535965">An agent calling another agent, an MCP tool, or a model in the same workspace is authorized by</text>
  <text x="70" y="560" font-size="13.5" font-weight="500" fill="#535965">its Kubernetes/mesh identity automatically. No API key is issued, sent, or checked for this path.</text>
</svg>
