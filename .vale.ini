StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Regression guards: fixed AI-slop phrases ("I hope this helps", "In today's fast-paced",
# "Let's unpack"). Each rule has zero hits on docs/versions/development and on the
# human-written prokube docs, so a hit is almost always a real regression.
# Rules that also fire on human writing (Metacommentary, FillerPhrases, EmDashUsage,
# VerbTricolon, ...) are deliberately left out.
[*.md]
ai-tells.AICompoundPhrases = YES
ai-tells.AIAdjectiveNounPairs = YES
ai-tells.AffirmativeFormulas = YES
ai-tells.AnnouncementHeadings = YES
ai-tells.ClosingPleasantries = YES
ai-tells.DespiteChallenges = YES
ai-tells.FalseExclusivity = YES
ai-tells.ListIntroductions = YES
ai-tells.MarketingHeadings = YES
ai-tells.OpeningCliches = YES
ai-tells.PromotionalPuffery = YES
ai-tells.ResonateOveruse = YES
ai-tells.StackedHedges = YES
ai-tells.StrategyBuzzwords = YES
ai-tells.StructureAnnouncements = YES
ai-tells.SycophancyMarkers = YES
ai-tells.UnpackExplore = YES
ai-tells.UrgencyInflation = YES
ai-tells.VagueAttributions = YES
ai-tells.WrapUpHeadings = YES
