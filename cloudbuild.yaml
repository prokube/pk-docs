# Runs only from the generated-site branches:
# - gh-pages (built from staging) -> prokube.cloud/docs
# - gh-pages-main (built from main) -> prokube.ai/docs
# The GitHub workflow builds VitePress, pushes the generated site to the
# branch, and includes this file in the output for the Cloud Build trigger.

substitutions:
  # Staging target. The production trigger overrides it with
  # gs://prokube-website-production/docs/.
  _DOCS_GCS_TARGET: 'gs://prokube-website/docs/'

steps:
  # The checkout's .git directory and this file are not part of the site.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: publish-site
    args: ['gsutil', '-m', 'rsync', '-r', '-d', '-x', '^(\.git/.*|\.mcp-docs/.*|cloudbuild\.yaml)$', '.', '${_DOCS_GCS_TARGET}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: publish-mcp-markdown
    entrypoint: bash
    args:
      - -euc
      - |
        if [[ "$BRANCH_NAME" != "gh-pages-main" ]]; then
          echo "Skipping MCP publication outside the production branch."
          exit 0
        fi
        [[ '${_DOCS_GCS_TARGET}' == 'gs://prokube-website-production/docs/' ]]
        test -d .mcp-docs/development
        test -n "$$(find .mcp-docs -type f -name '*.md' -print -quit)"
        gcloud storage rsync .mcp-docs gs://pk-docs-text-based-public/ \
          --recursive --checksums-only --delete-unmatched-destination-objects

options:
  logging: CLOUD_LOGGING_ONLY
